# Example configuration for OpenAI provider

ai:
  provider: openai
  model: gpt-4o  # or gpt-4o-mini, gpt-3.5-turbo, etc.
  api_key: ${OPENAI_API_KEY}
  temperature: 0.7
  max_tokens: 4096

shell:
  history_file: ~/.bash_history
  max_history: 1000
  enable_completion: true
  confirmation_dangerous: true

security:
  allowed_commands: []
  dangerous_commands:
    - rm -rf
    - mkfs
    - dd if=
    - >:
    - format
    - fdisk
  require_confirmation: true
  sandbox_mode: false
